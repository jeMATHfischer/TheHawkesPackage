[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "the-hawkes-package"
dynamic = ["version"]
description = "Simulation and Bayesian inference for temporal and spatio-temporal Hawkes processes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jens Fischer", email = "jefischer@posteo.de" }]
maintainers = [{ name = "Jens Fischer", email = "jefischer@posteo.de" }]
keywords = [
  "hawkes-process",
  "point-process",
  "self-exciting",
  "spatio-temporal",
  "ogata-thinning",
  "stochastic-simulation",
  "mcmc",
  "metropolis-hastings",
  "bayesian-inference",
  "sequential-monte-carlo",
  "particle-filter",
  "parameter-estimation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-randomly>=3.15",
  # Test-only, and deliberately not a runtime dependency: `HawkesEstimator`
  # implements scikit-learn's estimator protocol without importing it. This is
  # here so `tests/inference/test_sklearn_interop.py` can check that claim
  # against the real library instead of against our reading of it. Every test in
  # that file is guarded by `importorskip`, so the suite passes without it.
  "scikit-learn>=1.4",
  # Also test-only here, and the user-facing spelling is the `viz` extra below.
  # It is in `test` rather than left to the coverage job alone so that all ten
  # matrix jobs run the *same* set of tests: a marker-gated test dependency
  # makes jobs diverge, and this repo has already lost half a matrix to a
  # difference that only showed on some of them. plotly is a pure-Python wheel
  # supporting 3.8+, so unlike a compiled backend it costs the matrix nothing.
  "plotly>=5.18",
]
docs = [
  "sphinx>=7.3",
  "furo>=2024.5.6",
  "myst-nb>=1.1",
  "numpydoc>=1.7",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6",
  "matplotlib>=3.10.9",
  # myst-nb executes the example notebooks and needs a kernel to do it.
  "ipykernel>=6.29",
  # `docs/examples/intensity_surfaces.ipynb` renders live figures, so the docs
  # build needs the same backend the `viz` extra below installs -- for a
  # different reason, which is why it is pinned twice rather than composed:
  # `docs` needs it to *execute* an example, `viz` is what a user installs to
  # render one. Without it the Docs job fails at execution on the ImportError
  # `viz._plotly` raises by design.
  "plotly>=5.18",
]
viz = [
  # The rendering backend for `hawkes_package.viz`, and deliberately not a
  # runtime dependency: `intensity_frames` builds the field from the simulator's
  # own hooks with nothing but numpy, and only writing the HTML page needs this.
  # `viz._plotly` is the single module that names it, inside a function body, so
  # `import hawkes_package.viz` works without it and says what to install when a
  # render is attempted.
  #
  # SageMath was the first choice -- `parametric_plot3d(color=(cf, colormap))`
  # and `animate(...).interactive()` are exactly this feature, prebuilt -- and
  # was abandoned for a packaging reason, not a technical one: every
  # `passagemath-plot` release pins `memory_allocator<0.2`, whose Windows wheels
  # stop at cp310, while passagemath itself requires 3.11 or newer. The two
  # constraints cannot both be met on Windows at any Python version, and
  # `cysignals` has never shipped a Windows wheel at all.
  "plotly>=5.18",
]
dev = [
  "the-hawkes-package[test,docs]",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "build>=1.2",
  "twine>=6.1",
  "nbstripout>=0.7",
]

[project.urls]
Homepage = "https://github.com/jeMATHfischer/TheHawkesPackage"
Documentation = "https://jeMATHfischer.github.io/TheHawkesPackage/"
Repository = "https://github.com/jeMATHfischer/TheHawkesPackage"
Issues = "https://github.com/jeMATHfischer/TheHawkesPackage/issues"
Changelog = "https://github.com/jeMATHfischer/TheHawkesPackage/blob/master/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

[tool.hatch.version]
path = "src/hawkes_package/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hawkes_package"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "docs/",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  # docs/contributing.md is nothing but `{include} ../CONTRIBUTING.md`, so
  # omitting this breaks `sphinx-build -W` from an unpacked sdist.
  "CONTRIBUTING.md",
  "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
# `N` (pep8-naming) was off through 0.3.x because `Events`, `Sim_num`,
# `Base`, `Space`, `L1` and `L2` were public API. 0.4.0 renamed or removed
# every one of them, and turning it back on is what stops them creeping in
# again -- the point of doing the rename at all.
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "NPY", "PT", "RET", "ARG", "D", "RUF"]
# `TID` is deliberately absent: TID252 bans parent-relative imports, but
# `from ..mcmc import mcmc_sampler` is exactly the right way for a subpackage to
# reach its sibling and rewriting them as absolute would only add coupling.
ignore = [
  "D105", # magic-method docstrings
  "D107", # __init__ docstring — documented on the class, numpydoc style
  "E731", # lambda assignment — pervasive and idiomatic in the kernel code
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# NPY002: tests/test_base.py calls np.random.seed on purpose, to prove that the
# legacy global stream no longer influences simulations.
# N: a test may name a fixture or a helper after the deprecated spelling it
# exists to pin.
"tests/**" = ["D", "ARG", "B018", "NPY002", "N"]
"docs/conf.py" = ["D", "INP001"]
# N803: scikit-learn's estimator protocol fixes the argument name `X`, and
# `clone` reconstructs an estimator by passing every parameter by keyword -- so
# renaming it to satisfy pep8-naming would break cloning rather than tidy it.
"src/hawkes_package/inference/estimator.py" = ["N803"]
# Notebooks are narrative: throwaway kernel helpers do not need docstrings, and
# demonstration loops legitimately ignore their index.
"*.ipynb" = ["D", "ARG", "B007", "RET504", "E402", "N816"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Typing
# ---------------------------------------------------------------------------

[tool.mypy]
# `python_version` is deliberately unset: NumPy's bundled stubs use PEP 695
# `type` statements, which mypy can only parse when targeting 3.12+, so
# pinning it to the 3.10 floor makes mypy fail on numpy rather than on us.
# Syntax compatibility with the floor is enforced by ruff's target-version,
# and the CI matrix runs the floor for real.
files = ["src"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# scikit-learn ships no `py.typed`, so mypy reports `import-untyped` for it
# whether or not it is installed. `src` names it in exactly one place -- the
# lazy import inside `HawkesEstimator.__sklearn_tags__` -- and this makes
# `BaseEstimator` `Any` for those three lines, which call into an untyped
# library and could not have been checked anyway. It is emphatically *not* what
# would be needed to inherit from it: `disallow_subclassing_any` is a separate
# part of `strict` and still refuses that, which is the whole reason the
# estimator reimplements the protocol instead.
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

# plotly ships no `py.typed` either. `src` names it in exactly one place -- the
# lazy import inside `viz._plotly._backend` -- and everything that crosses that
# boundary is already annotated `Any`, because a figure object has no type we
# could usefully state. Without this the lint job's answer would depend on
# whether the optional `[viz]` extra happened to be installed, which is the one
# thing a lint job must never do.
[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "slow: long-running tests (deselect with -m 'not slow')",
  "statistical: seeded distributional-correctness checks",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
parallel = true
source_pkgs = ["hawkes_package"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
  "@overload",
  "^\\s*\\.\\.\\.$",
]
