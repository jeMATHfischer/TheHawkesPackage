name: Docs

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[docs]"

      # The key includes the source tree, so an API change re-executes the
      # notebooks (which is what makes the docs build an example regression
      # test) while a prose-only edit reuses the cache.
      - uses: actions/cache@v4
        with:
          path: docs/_build/.jupyter_cache
          key: jupyter-cache-${{ hashFiles('docs/examples/*.ipynb', 'src/**/*.py') }}
          restore-keys: jupyter-cache-

      # -W turns warnings into errors and nb_execution_raise_on_error makes a
      # broken example fail the build rather than render a traceback.
      - name: sphinx-build
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
