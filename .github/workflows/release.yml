name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine

      - name: Tag must match hawkes_package.__version__
        run: |
          python -m pip install --quiet -e .
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import hawkes_package; print(hawkes_package.__version__)")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match hawkes_package.__version__ ($PKG)"
            exit 1
          fi
          echo "tag and package version agree: $PKG"

      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Requires a PyPI *pending publisher* to exist before the first release:
    # project the-hawkes-package, owner jeMATHfischer, repo TheHawkesPackage,
    # workflow release.yml, environment pypi. Without it the very first upload
    # of a new project is rejected.
    environment: pypi
    permissions:
      id-token: write # OIDC trusted publishing; no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract this version's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
