name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy

  test:
    name: Test ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # The oldest entry must match requires-python in pyproject.toml;
        # tests/test_api_surface.py asserts the declared floor so the two
        # cannot drift apart unnoticed.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - name: Run the fast suite
        # Surface failures as check annotations. The raw log needs repository
        # admin rights to download, so a bare "exit code 1" is all a
        # contributor -- or a bot -- can otherwise see, and diagnosing the
        # first 0.4.0 rehearsal failure cost an afternoon for exactly that.
        shell: bash
        run: |
          set -o pipefail
          pytest -m "not slow" -q -rf 2>&1 | tee pytest.log && exit 0
          grep -E '^(FAILED|ERROR)' pytest.log | while read -r line; do
            echo "::error::$line"
          done
          exit 1

  coverage:
    name: Coverage
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      # The full suite, slow tests included, so the gate is never computed on a
      # truncated run.
      - name: Run the full suite with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: Build and verify the wheel
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

      # A src-layout packaging slip is invisible to an editable install, so the
      # wheel's actual contents are checked here rather than in the test suite.
      # The wheel shipped two top-level packages until 0.4.0 removed the
      # `TheHawkesPackage` shim. Asserting the survivor is present *and* that
      # the shim is not is what keeps a stale `packages` entry from quietly
      # re-adding it.
      - name: Wheel contains one package and the typing marker
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          for required in ("hawkes_package/__init__.py", "hawkes_package/py.typed"):
              assert required in names, f"{required} missing from {wheel.name}"
          tops = {name.split("/")[0] for name in names if not name.endswith(".dist-info")}
          stale = {t for t in tops if t.endswith(".dist-info") or t == "TheHawkesPackage"}
          assert not stale, f"{wheel.name} still ships {sorted(stale)}"
          print(f"{wheel.name}: all required members present, and nothing else")
          PY

      - name: Import from a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --quiet dist/*.whl
          # The canonical import must be completely silent.
          /tmp/clean/bin/python -W error::DeprecationWarning -c "
          import hawkes_package as hp
          print('hawkes_package', hp.__version__)
          "
          # And the shim removed in 0.4.0 must be genuinely gone, not merely
          # undocumented.
          /tmp/clean/bin/python -c "
          import importlib.util
          assert importlib.util.find_spec('TheHawkesPackage') is None, 'the shim is still packaged'
          print('TheHawkesPackage shim is gone')
          "
